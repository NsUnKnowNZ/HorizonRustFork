# Camerapture (chrrs, MIT) for Horizon: cameras, pictures, picture frames and albums.
#  - Right-click a camera to raise it (viewfinder, scroll to zoom); left-click takes a picture
#    for a sheet of paper. The picture uploads to the server in parts and comes back as a
#    `camerapture:picture` item, drawn with its picture in hand, in slots and full screen.
#  - Sneak + use a picture on a wall hangs it in a frame (use turns it, sneak + use resizes it,
#    attack breaks it). Albums hold 36 pictures and lie on lecterns.
# Its content (items, models, textures, sounds, lang, recipes) is horizon-mods/camerapture.
# Engine support it uses: mod textures (game/mod_textures.rs), mods' special item models
# (game/item_draw.rs), native_grab_world and hud::encode_webp (docs/native-mods.md).
[mod]
id = "camerapture"
version = "1.10.12"
priority = 100

[[module]]
id = "common"
file = "crates/horizon-client/src/game.rs"
name = "camerapture"
source = "camerapture.rs"

[[module]]
id = "client"
file = "crates/horizon-client/src/game.rs"
name = "camerapture_client"
source = "camerapture_client.rs"

[[module]]
id = "frames"
file = "crates/horizon-client/src/game.rs"
name = "camerapture_frames"
source = "camerapture_frames.rs"

