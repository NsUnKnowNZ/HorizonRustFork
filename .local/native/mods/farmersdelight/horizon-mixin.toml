# Farmer's Delight's kitchen blocks, written from the mod's documented behaviour and its own data
# files: the cutting board, the stove, the cooking pot (with its screen) and the Nourishment and
# Comfort effects. The content (blocks, items, recipes, textures) is the farmersdelight content mod.
[mod]
id = "farmersdelight"
version = "0.1.0"
priority = 100

[[module]]
id = "game"
file = "crates/horizon-client/src/game.rs"
name = "farmersdelight"
source = "farmersdelight.rs"

[[injection]]
id = "entity"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_block_entity"
helper = "entity.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "entity", ty = "&mut Option<(String, horizon_world::nbt::Compound)>", value = "&mut *entity" },
]

[[injection]]
id = "ticks"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_block_entity_ticks"
helper = "ticks.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "ticks", ty = "&mut bool", value = "&mut *ticks" },
]

[[injection]]
id = "container"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_block_entity_container"
helper = "container.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "container", ty = "&mut Option<horizon_client::containers::ModContainer>", value = "&mut *container" },
]

[[injection]]
id = "tick"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_block_entity_tick"
helper = "tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "entity", ty = "&mut horizon_client::containers::ModBlockEntity", value = "&mut *entity" },
]

[[injection]]
id = "update-tag"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_block_entity_update_tag"
helper = "update-tag.rs"
bindings = [
  { name = "entity", ty = "&horizon_client::containers::ModBlockEntity", value = "entity" },
  { name = "tag", ty = "&mut Option<horizon_world::nbt::Compound>", value = "&mut *tag" },
]

[[injection]]
id = "submit"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_block_entity_submit"
helper = "submit.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "block", ty = "&str", value = "block" },
  { name = "state", ty = "horizon_world::registry::BlockStateId", value = "state" },
  { name = "entity", ty = "&horizon_client::containers::ModBlockEntity", value = "entity" },
  { name = "draw", ty = "&mut crate::game::native_block_entity_draw::BlockEntityDraw", value = "&mut *draw" },
]

[[injection]]
id = "screen"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_screen"
helper = "screen.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "screen", ty = "&mut Option<crate::game::native_hooks::NativeScreen>", value = "&mut *screen" },
]

[[injection]]
id = "screen-draw"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_screen_draw"
helper = "screen-draw.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "block", ty = "&str", value = "block" },
  { name = "data", ty = "&[i32]", value = "data" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" },
  { name = "origin", ty = "[f32; 2]", value = "origin" },
]

[[injection]]
id = "right-click-block"
kind = "HEAD"
hook = "right_click_block"
hook_version = 1
helper = "right-click-block.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "face", ty = "[i32; 3]", value = "face" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" }
]

[[injection]]
id = "place"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_place_block"
helper = "place.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "state", ty = "horizon_world::registry::BlockStateId", value = "state" },
]

[[injection]]
id = "player-tick"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_player_tick"
helper = "player-tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]
