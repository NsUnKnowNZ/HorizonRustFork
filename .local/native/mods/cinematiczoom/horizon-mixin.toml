# Cinematic Zoom (smallinger, MIT) for Horizon, written from its documented behaviour: hold C
# to zoom with a smooth glide, the cinematic camera and letterbox bars; the wheel sets how far.
[mod]
id = "cinematiczoom"
version = "1.0.0"
priority = 50

[[module]]
id = "game"
file = "crates/horizon-client/src/game.rs"
name = "cinematiczoom"
source = "zoom.rs"

[[injection]]
id = "key"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_key"
helper = "key.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "key", ty = "&str", value = "key" },
  { name = "pressed", ty = "bool", value = "pressed" },
]

[[injection]]
id = "zoom"
kind = "HEAD"
hook = "zoom"
hook_version = 1
helper = "zoom-hook.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "zoom", ty = "&mut Option<horizon_client::mod_api::NativeZoom>", value = "&mut *zoom" }
]

[[injection]]
id = "wheel"
kind = "HEAD"
hook = "wheel"
hook_version = 1
helper = "wheel.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "steps", ty = "f32", value = "steps" },
  { name = "claimed", ty = "&mut bool", value = "&mut *claimed" }
]

[[injection]]
id = "hud"
kind = "HEAD"
hook = "hud"
hook_version = 1
helper = "hud.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" }
]

[[injection]]
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]
