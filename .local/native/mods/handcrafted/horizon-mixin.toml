# Handcrafted (Terrarium, local use) for Horizon: what its furniture does, written from the mod's
# documented behaviour. The blocks, items, textures and recipes are the content mod
# horizon-mods/handcrafted (carried over by horizon-port-pack).
#  - A sheet on a table, side table, nightstand, desk or fancy bed lays a cloth of its colour; a
#    cushion on a chair, couch, bench or dining bench gives it that colour (one is used up).
#  - Sneak + right click with an empty hand takes the sheet or cushion back.
#  - The hammer turns a shelf, counter, cupboard, drawer or trim to its next look.
#  - Counters, cupboards, desks, drawers, nightstands, shelves and side tables hold 27 stacks
#    (a barrel underneath, placed level and facing the player).
#  - Right click a chair, couch, bench or dining bench with an empty hand to sit on it.
#  - Tables join tables round them; couches, benches, shelves and fancy beds join their own
#    kind beside them facing the same way.
[mod]
id = "handcrafted"
version = "0.1.0"
priority = 100

[[module]]
id = "game"
file = "crates/horizon-client/src/game.rs"
name = "handcrafted"
source = "handcrafted.rs"

[[injection]]
id = "use"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_use_item_on"
helper = "use.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "stack", ty = "&horizon_client::items::ItemStack", value = "stack" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "claimed", ty = "&mut bool", value = "&mut *claimed" },
]

[[injection]]
id = "click"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_right_click_block"
helper = "click.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "level_tick_post"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_level_tick_post"
helper = "tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "dimension", ty = "&str", value = "dimension" },
]

[[injection]]
id = "place"
kind = "HEAD"
target = "horizon_client::game::native_hooks::GameLevel<'_>::native_state_for_placement"
helper = "place.rs"
bindings = [
  { name = "level", ty = "&crate::game::GameLevel<'_>", value = "&*self" },
  { name = "state", ty = "horizon_world::registry::BlockStateId", value = "state" },
  { name = "context", ty = "&horizon_world::level::PlacementContext", value = "context" },
  { name = "answer", ty = "&mut Option<Option<horizon_world::registry::BlockStateId>>", value = "&mut *answer" },
]

[[injection]]
id = "shape"
kind = "HEAD"
target = "horizon_client::game::native_hooks::GameLevel<'_>::native_update_shape"
helper = "shape.rs"
bindings = [
  { name = "level", ty = "&crate::game::GameLevel<'_>", value = "&*self" },
  { name = "pos", ty = "horizon_core::position::BlockPos", value = "pos" },
  { name = "state", ty = "horizon_world::registry::BlockStateId", value = "state" },
  { name = "neighbour_pos", ty = "horizon_core::position::BlockPos", value = "neighbour_pos" },
  { name = "neighbour", ty = "horizon_world::registry::BlockStateId", value = "neighbour" },
  { name = "new", ty = "&mut Option<horizon_world::registry::BlockStateId>", value = "&mut *new" },
]
