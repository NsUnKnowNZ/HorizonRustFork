# Xaero's World Map (xaero96) for Horizon, written from its documented behaviour (no Xaero
# code or assets): the explored world on a full-screen map, saved per world and dimension.
# M opens it. The map store is the engine's horizon_client::world_map. See worldmap.rs.
[mod]
id = "xaeroworldmap"
version = "1.39.0"
priority = 100

[[module]]
id = "worldmap"
file = "crates/horizon-client/src/game.rs"
name = "xaeroworldmap"
source = "worldmap.rs"

[[injection]]
id = "key"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_key"
helper = "key.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "key", ty = "&str", value = "key" },
  { name = "pressed", ty = "bool", value = "pressed" },
]

[[injection]]
id = "client-tick"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_client_tick_post"
helper = "client-tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" }
]

[[injection]]
id = "screen-render-post"
kind = "HEAD"
hook = "screen_render_post"
hook_version = 1
helper = "screen-render-post.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" },
  { name = "screen", ty = "&horizon_client::mod_api::NativeScreenView<'_>", value = "screen" }
]

[[injection]]
id = "screen-scroll"
kind = "HEAD"
hook = "screen_mouse_scrolled_pre"
hook_version = 1
helper = "screen-scroll.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "screen", ty = "&horizon_client::mod_api::NativeScreenView<'_>", value = "screen" },
  { name = "scroll", ty = "[f64; 2]", value = "scroll" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" }
]

[[injection]]
id = "screen-drag"
kind = "HEAD"
hook = "screen_mouse_dragged_pre"
hook_version = 1
helper = "screen-drag.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "screen", ty = "&horizon_client::mod_api::NativeScreenView<'_>", value = "screen" },
  { name = "button", ty = "i32", value = "button" },
  { name = "delta", ty = "[f32; 2]", value = "delta" },
  { name = "modifiers", ty = "u32", value = "modifiers" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" }
]

[[injection]]
id = "screen-key"
kind = "HEAD"
hook = "screen_key_pressed_pre"
hook_version = 1
helper = "screen-key.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "screen", ty = "&horizon_client::mod_api::NativeScreenView<'_>", value = "screen" },
  { name = "key", ty = "&str", value = "key" },
  { name = "modifiers", ty = "u32", value = "modifiers" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" }
]

[[injection]]
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

# Leaving the world: the map is saved.
[[injection]]
id = "disconnecting"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_client_disconnecting"
helper = "disconnecting.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" }
]
