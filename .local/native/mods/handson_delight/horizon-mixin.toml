# Hands-On Delight for Horizon, written from its documented and shown behaviour: Farmer's Delight's
# cooking pot and cutting board worked by hand in the world, the camera flown to the station.
# Needs the farmersdelight native mod (its kitchen blocks and recipes).
[mod]
id = "handson_delight"
version = "1.0.0"
priority = 120

[[module]]
id = "game"
file = "crates/horizon-client/src/game.rs"
name = "handson_delight"
source = "handson.rs"

# A right click on a pot or a board opens its scene.
[[injection]]
id = "mouse"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::play_input::Game<'_>::play_mouse"
helper = "mouse.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "button", ty = "winit::event::MouseButton", value = "button" },
  { name = "pressed", ty = "bool", value = "pressed" },
]

# The station's camera.
[[injection]]
id = "camera"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::perspective::Game<'_>::camera_view"
helper = "camera.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
]

[[injection]]
id = "client-tick"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_client_tick_post"
helper = "client-tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" }
]

[[injection]]
id = "screen-render-post"
kind = "HEAD"
hook = "screen_render_post"
hook_version = 1
helper = "screen-render-post.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" },
  { name = "screen", ty = "&horizon_client::mod_api::NativeScreenView<'_>", value = "screen" }
]

[[injection]]
id = "screen-press"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_screen_mouse_button_pressed_pre"
helper = "screen-press.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "screen", ty = "&horizon_client::mod_api::NativeScreenView<'_>", value = "screen" },
  { name = "button", ty = "i32", value = "button" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" }
]

[[injection]]
id = "screen-release"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_screen_mouse_button_released_pre"
helper = "screen-release.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "screen", ty = "&horizon_client::mod_api::NativeScreenView<'_>", value = "screen" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" }
]

[[injection]]
id = "screen-drag"
kind = "HEAD"
hook = "screen_mouse_dragged_pre"
hook_version = 1
helper = "screen-drag.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "screen", ty = "&horizon_client::mod_api::NativeScreenView<'_>", value = "screen" },
  { name = "button", ty = "i32", value = "button" },
  { name = "delta", ty = "[f32; 2]", value = "delta" },
  { name = "modifiers", ty = "u32", value = "modifiers" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" }
]

[[injection]]
id = "screen-key"
kind = "HEAD"
hook = "screen_key_pressed_pre"
hook_version = 1
helper = "screen-key.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "screen", ty = "&horizon_client::mod_api::NativeScreenView<'_>", value = "screen" },
  { name = "key", ty = "&str", value = "key" },
  { name = "modifiers", ty = "u32", value = "modifiers" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" }
]

[[injection]]
id = "submit"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_block_entity_submit"
helper = "submit.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "block", ty = "&str", value = "block" },
  { name = "state", ty = "horizon_world::registry::BlockStateId", value = "state" },
  { name = "entity", ty = "&horizon_client::containers::ModBlockEntity", value = "entity" },
  { name = "draw", ty = "&mut crate::game::native_block_entity_draw::BlockEntityDraw", value = "&mut *draw" },
]

[[injection]]
id = "net-from-client"
kind = "HEAD"
hook = "net_from_client"
hook_version = 1
helper = "net-from-client.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "player", ty = "u128", value = "player" },
  { name = "channel", ty = "&str", value = "channel" },
  { name = "data", ty = "&[u8]", value = "data" }
]

[[injection]]
id = "player-tick"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_player_tick"
helper = "player-tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

[[injection]]
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]
